name: HA Codex Chat (Test)

description: >
  Local test build of HA Codex Fixed with a spellchecked multiline message
  composer. Installed separately from the original add-on.

version: "1.2.7.5"
slug: home_assistant_codex_chat_test
url: https://github.com/Bert4444/ha-codex-fixed

arch:
  - amd64
  - aarch64

startup: application
boot: manual
init: false

ingress: true
ingress_port: 7681
ingress_stream: true

homeassistant_api: true

panel_icon: mdi:robot-outline
panel_title: HA Codex Chat (Test)

map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant

  - type: addon_config
    read_only: false
    path: /config

options:
  model: gpt-5.6-terra
  terminal_font_size: 14
  terminal_scrollback: 5000
  terminal_theme: dark
  session_persistence: true
  preserve_terminal_history: true
  patch_compatibility_mode: true
  file_transfer: false
  home_assistant_control: false
  allow_home_assistant_restart: false

schema:
  model: list(gpt-5.6-terra|gpt-5.6-sol|gpt-5.6-luna|gpt-5.6|gpt-5.5|gpt-5.4|gpt-5.4-mini|gpt-5.3-codex-spark)
  terminal_font_size: int(10,24)
  terminal_scrollback: int(1000,50000)
  terminal_theme: list(dark|light)
  session_persistence: bool
  preserve_terminal_history: bool
  patch_compatibility_mode: bool
  file_transfer: bool
  home_assistant_control: bool
  allow_home_assistant_restart: bool
